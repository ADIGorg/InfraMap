openapi: 3.1.0

info:
  title: InfraMap API
  version: 1.0.0
  license:                               
    name: UNLICENSED
    identifier: UNLICENSED
  description: |
    API REST do InfraMap, responsável pela autenticação,
    identificação de usuários, gerenciamento de perfis,
    consulta de categorias e integração com o Supabase.

    A API utiliza Supabase Auth para validar tokens JWT
    e PostgreSQL com Row Level Security (RLS) para
    controlar o acesso aos dados.

servers:
  - url: http://localhost:3000/api/v1
    description: Ambiente local de desenvolvimento

tags:
  - name: Health
    description: Verificação de disponibilidade da API.
  - name: Identity
    description: Identificação e gerenciamento de perfis de usuários.
  - name: App
    description: Endpoints destinados ao aplicativo cidadão.
  - name: Admin
    description: Endpoints destinados ao painel administrativo.
  - name: Categories
    description: Consulta pública às categorias de infraestrutura.
  - name: Notifications
    description: Notificações do cidadão autenticado.

paths:
  # ========================================
  # HEALTH
  # ========================================

  /health:
    get:
      tags: [Health]
      summary: Verificar disponibilidade da API
      description: |
        Verifica se a API está funcionando.
        Não exige autenticação.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: API funcionando.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                message: InfraMap API funcionando!
                timestamp: "2026-11-04T14:00:00.000Z"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ========================================
  # CATEGORIES
  # ========================================

  /categories:
    get:
      tags: [Categories]
      summary: Listar categorias ativas
      description: |
        Retorna as categorias ativas de infraestrutura urbana,
        ordenadas pelo código.

        Endpoint público: não exige autenticação.
      operationId: listActiveCategories
      security: []
      responses:
        "200":
          description: Categorias ativas retornadas com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesListResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ========================================
  # IDENTITY — ROTAS PROVISÓRIAS
  # ========================================

  /identity/users:
    post:
      tags: [Identity]
      summary: Validar dados para criação de usuário
      description: |
        Endpoint provisório que valida os dados recebidos
        utilizando Zod.

        IMPORTANTE: esta operação não cria usuários no
        Supabase Auth nem persiste informações no banco.

        A resposta confirma somente a validação, sem devolver
        os dados enviados ou a senha.

        Requer autenticação e perfil ADMIN.
      operationId: validateUserCreation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            example:
              name: Maria Silva
              email: maria@example.com
              password: senha123
              role: CITIZEN
      responses:
        "201":
          description: Dados validados. Nenhum usuário foi criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserValidationResponse"
              example:
                message: Dados validados. Nenhum usuário foi criado.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: [Identity]
      summary: Validar parâmetros de consulta de usuários
      description: |
        Valida os parâmetros de paginação utilizando Zod.

        Endpoint provisório: não realiza consulta de usuários
        no banco de dados.

        Apenas retorna os parâmetros validados.

        Requer autenticação.
      operationId: validateUsersQuery
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Número da página.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          required: false
          description: Quantidade máxima de registros por página.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        "200":
          description: Parâmetros validados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersQueryResponse"
              example:
                message: Parâmetros validados com sucesso.
                data:
                  page: 1
                  limit: 20
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /identity/users/{id}:
    get:
      tags: [Identity]
      summary: Validar identificador de usuário
      description: |
        Valida se o identificador informado é um UUID válido.

        Endpoint provisório: ainda não consulta os dados
        do usuário no banco de dados.

        Requer autenticação.
      operationId: validateUserId
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID do usuário.
          schema:
            type: string
            format: uuid
          example: 181227d2-89d7-4ceb-8dff-85b623aeee5b
      responses:
        "200":
          description: Identificador válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLookupResponse"
              example:
                message: "Buscando usuário 181227d2-89d7-4ceb-8dff-85b623aeee5b"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ========================================
  # ID-01 — PERFIL DO PRÓPRIO USUÁRIO
  # ========================================

  /identity/me:
    get:
      tags: [Identity]
      summary: Consultar o próprio perfil
      description: |
        Retorna os dados cadastrais do usuário autenticado.

        Requer token JWT válido e conta ativa.

        O usuário pode consultar somente o próprio perfil.

        Os dados cadastrais são consultados na tabela
        public.profiles, utilizando o JWT do usuário e
        respeitando as políticas RLS do Supabase.

        O e-mail é obtido do Supabase Auth.

        Contas inativas ou sem perfil de autorização
        válido não podem executar esta operação.
      operationId: getMyProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil consultado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileResponse"
              example:
                message: Usuário autenticado.
                data:
                  id: 181227d2-89d7-4ceb-8dff-85b623aeee5b
                  name: Maria Silva
                  phone: "(75) 99999-9999"
                  created_at: "2026-11-01T10:00:00.000Z"
                  updated_at: "2026-11-01T10:00:00.000Z"
                  email: maria@example.com
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Identity]
      summary: Atualizar o próprio perfil
      description: |
        Permite atualizar os dados cadastrais do
        usuário autenticado.

        Requer token JWT válido e conta ativa.

        Somente os campos name e phone são permitidos.

        A operação não permite modificar:
        - id
        - email
        - role
        - admin_level
        - is_active

        A atualização ocorre exclusivamente no registro
        associado ao identificador do usuário autenticado.

        A API utiliza o JWT do usuário para acessar o
        Supabase e respeita as políticas RLS.

        O campo name deve conter entre 3 e 150 caracteres.

        O campo phone é opcional e deve conter entre
        8 e 15 dígitos numéricos, considerando sua
        formatação.

        Para remover um telefone cadastrado, envie null.

        Deve ser informado pelo menos um campo válido.
      operationId: updateMyProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyProfileRequest"
            example:
              name: Maria Souza
              phone: "(75) 98888-8888"
      responses:
        "200":
          description: Perfil atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileResponse"
              example:
                message: Perfil atualizado com sucesso.
                data:
                  id: 181227d2-89d7-4ceb-8dff-85b623aeee5b
                  name: Maria Souza
                  phone: "(75) 98888-8888"
                  created_at: "2026-11-01T10:00:00.000Z"
                  updated_at: "2026-11-08T18:00:00.000Z"
                  email: maria@example.com
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Identity]
      summary: Desativar e anonimizar a própria conta
      description: |
        Permite que um cidadão autenticado, com conta ativa,
        solicite a desativação da própria conta.

        A operação tenta revogar as sessões no Supabase Auth,
        desativa o acesso (user_roles.is_active = false),
        substitui o nome por "Usuário excluído", remove o
        telefone cadastrado e anonimiza os dados pessoais
        de autenticação no Supabase Auth.

        As ocorrências, fotos e o histórico são preservados.

        Se a anonimização do Auth falhar após a desativação
        no banco, a conta permanece desativada e a limpeza
        pendente poderá ser retomada administrativamente.

        Não recebe identificador de usuário no corpo:
        a operação utiliza a identidade do próprio JWT.
      operationId: deactivateMyAccount
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Conta desativada e anonimizada com sucesso. Resposta sem corpo.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: |
            Não foi possível revogar as sessões ou a conta
            foi desativada e a anonimização do Auth está pendente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                sessionRevocationFailed:
                  summary: Falha ao encerrar sessões
                  value:
                    error:
                      code: SESSION_REVOCATION_FAILED
                      message: Não foi possível encerrar as sessões. A conta não foi desativada.
                authCleanupPending:
                  summary: Conta desativada com limpeza pendente
                  value:
                    error:
                      code: ACCOUNT_DEACTIVATED_AUTH_PENDING
                      message: Conta desativada. A limpeza dos dados de autenticação está pendente.
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ========================================
  # IDENTITY — VERIFICAÇÃO ADMINISTRATIVA
  # ========================================

  /identity/admin-check:
    get:
      tags: [Identity]
      summary: Verificar acesso administrativo
      description: |
        Verifica se o usuário autenticado possui
        perfil ADMIN e conta ativa.

        Requer autenticação.
      operationId: checkAdminAccess
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Acesso administrativo autorizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: Acesso administrativo autorizado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ========================================
  # APP — IDENTIDADE DO CIDADÃO
  # ========================================

  /app/me:
    get:
      tags: [App]
      summary: Identificar cidadão autenticado
      description: |
        Retorna o identificador, o perfil e a situação
        da conta do cidadão autenticado.

        Requer token JWT válido, perfil CITIZEN
        e conta ativa.
      operationId: getCitizenIdentity
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Identidade do cidadão retornada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResponse"
              example:
                id: 181227d2-89d7-4ceb-8dff-85b623aeee5b
                role: CITIZEN
                is_active: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ========================================
  # ADMIN — IDENTIDADE DO ADMINISTRADOR
  # ========================================

  /admin/me:
    get:
      tags: [Admin]
      summary: Identificar administrador autenticado
      description: |
        Retorna o identificador, o perfil e a situação
        da conta do administrador autenticado.

        Requer token JWT válido, perfil ADMIN
        e conta ativa.
      operationId: getAdminIdentity
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Identidade do administrador retornada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResponse"
              example:
                id: 181227d2-89d7-4ceb-8dff-85b623aeee5b
                role: ADMIN
                is_active: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ========================================
  # VOTES — IMPACTO COMUNITÁRIO
  # ========================================

  /occurrences/{id}/votes:
    get:
      tags: [App]
      summary: Consulta a contagem de votos de uma ocorrência pública
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Contagem pública de votos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteCountResponse"
        "400":
          description: Identificador inválido
        "404":
          description: Ocorrência pública não encontrada
    post:
      tags: [App]
      summary: Registra um voto do cidadão ativo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Voto registrado e contagem atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteCountResponse"
        "400":
          description: Identificador inválido
        "401":
          description: Autenticação necessária
        "403":
          description: Acesso negado ou voto na própria ocorrência
        "404":
          description: Ocorrência não encontrada
        "409":
          description: Voto duplicado ou ocorrência inelegível

  /occurrences/{id}/votes/me:
    delete:
      tags: [App]
      summary: Retira o voto do próprio cidadão
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Voto retirado e contagem atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteCountResponse"
        "400":
          description: Identificador inválido
        "401":
          description: Autenticação necessária
        "403":
          description: Acesso negado
        "404":
          description: Ocorrência ou voto não encontrado
        "409":
          description: Ocorrência inelegível

  # ========================================
  # AI-02 / AI-03 — ANÁLISE DE FOTOGRAFIAS
  # ========================================

  /ai-analyses:
    post:
      tags: [App]
      summary: Criar análise com fotografias
      description: |
        Permite que um cidadão autenticado e ativo crie uma análise
        enviando de 1 a 3 fotografias JPEG ou PNG, com até 5 MB cada.

        Os arquivos são armazenados no bucket privado occurrence-photos.
        A análise é criada com status PENDING; o processamento por IA
        ocorre posteriormente, em outra operação.
      operationId: createAiAnalysis
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - photos
              properties:
                photos:
                  type: array
                  description: Fotografias da mesma ocorrência.
                  minItems: 1
                  maxItems: 3
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Análise criada com sucesso.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - id
                      - status
                      - photo_count
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [PENDING]
                      photo_count:
                        type: integer
                        minimum: 1
                        maximum: 3
              example:
                data:
                  id: 181227d2-89d7-4ceb-8dff-85b623aeee5b
                  status: PENDING
                  photo_count: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Falha no upload ou na criação da análise.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /ai-analyses/{id}/analyze:
    post:
      tags: [App]
      summary: Solicitar processamento de uma análise por IA
      description: |
        Inicia o processamento das fotografias de uma análise pertencente
        ao cidadão autenticado e ativo.

        Aceita análises PENDING e FAILED, permitindo uma nova tentativa
        quando o processamento anterior falhou. Retorna 202 Accepted;
        o resultado deve ser consultado pelo GET /ai-analyses/{id}.

        O resultado sugere categoria, descrição e confiança entre 0 e 1.
        Se a confiança for inferior a 0,70, aplica-se a categoria CAT07.

        Não cria ocorrência automaticamente. O cidadão deve revisar e
        confirmar as sugestões antes de cadastrar a ocorrência.

        No MVP, o processamento ocorre no próprio processo Node.js,
        sem fila persistente. Uma interrupção do servidor pode deixar
        a análise em PROCESSING até uma recuperação administrativa.
      operationId: processAiAnalysis
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID da análise a processar.
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Solicitação de processamento aceita.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - id
                      - message
                    properties:
                      id:
                        type: string
                        format: uuid
                      message:
                        type: string
              example:
                data:
                  id: 181227d2-89d7-4ceb-8dff-85b623aeee5b
                  message: Análise recebida para processamento.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A análise não está elegível para processamento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Serviço de IA ou banco temporariamente indisponível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /ai-analyses/{id}:
    get:
      tags: [App]
      summary: Consultar a própria análise de fotografias
      description: |
        Retorna o estado e o resultado persistido da análise do cidadão
        autenticado e ativo. Análises de outros usuários não são expostas.

        A categoria e a descrição retornadas são sugestões da IA:
        o cidadão deve revisá-las antes de criar uma ocorrência.
      operationId: getAiAnalysis
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID da análise a consultar.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Análise encontrada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/AiAnalysisDetails"
              example:
                data:
                  id: 181227d2-89d7-4ceb-8dff-85b623aeee5b
                  status: COMPLETED
                  category_code: CAT03
                  suggested_description: Buraco identificado na via pública.
                  confidence: 0.92
                  model_name: mock-ai
                  prompt_version: v1
                  error_code: null
                  photo_count: 1
                  created_at: "2026-11-09T15:00:00.000Z"
                  completed_at: "2026-11-09T15:00:05.000Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Banco temporariamente indisponível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ========================================
  # NOTIFICAÇÕES — CIDADÃO AUTENTICADO
  # ========================================

  /notifications:
    get:
      tags: [Notifications]
      summary: Lista as notificações do cidadão autenticado
      description: |
        Ordena da mais recente para a mais antiga. Use esta rota também após
        reconectar o aplicativo para recuperar notificações persistidas.

        Para receber novas notificações, assine eventos INSERT de Postgres Changes
        na tabela public.notifications com JWT e filtro user_id=eq.<id do usuário>.
        A política RLS limita a entrega ao destinatário. Os eventos são publicados
        após o commit e o REST permanece como fonte de verdade.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 21474836
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Notificações paginadas
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
                  pagination:
                    type: object
                    required: [page, limit, total, total_pages]
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      total_pages:
                        type: integer
        "400":
          description: Paginação inválida
        "401":
          description: Token ausente ou inválido
        "403":
          description: Conta inativa ou papel incompatível

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Marca uma notificação como lida
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Notificação lida, inclusive se já estava lida
        "400":
          description: Identificador inválido
        "401":
          description: Token ausente ou inválido
        "403":
          description: Conta inativa ou papel incompatível
        "404":
          description: Notificação não encontrada para este cidadão

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Marca todas as notificações do cidadão como lidas
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Operação concluída
        "401":
          description: Token ausente ou inválido
        "403":
          description: Conta inativa ou papel incompatível

  # ========================================
  # ADMIN — DASHBOARD
  # ========================================

  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Consulta indicadores administrativos
      description: |
        Exige ADMIN ativo (MASTER ou OPERATIONAL). Considera todas as ocorrências.
        A prioridade HIGH é contada em todos os status. A média usa apenas
        RESOLVED com resolved_at e representa dias decorridos de 24 horas,
        incluindo frações. Sem resoluções elegíveis, a média é null.
        As contagens sempre incluem os seis status, mesmo quando são zero.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Indicadores calculados em uma consulta no banco
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [counts_by_status, high_priority_total, average_resolution_days]
                    properties:
                      counts_by_status:
                        type: object
                        required: [RECEIVED, UNDER_ANALYSIS, CONFIRMED, IN_SERVICE, RESOLVED, REJECTED]
                        properties:
                          RECEIVED:
                            type: integer
                            minimum: 0
                          UNDER_ANALYSIS:
                            type: integer
                            minimum: 0
                          CONFIRMED:
                            type: integer
                            minimum: 0
                          IN_SERVICE:
                            type: integer
                            minimum: 0
                          RESOLVED:
                            type: integer
                            minimum: 0
                          REJECTED:
                            type: integer
                            minimum: 0
                      high_priority_total:
                        type: integer
                        minimum: 0
                      average_resolution_days:
                        type: [number, "null"]
        "401":
          description: Token ausente ou inválido
        "403":
          description: Conta inativa ou usuário sem papel ADMIN
        "500":
          description: Falha ao consultar indicadores

  # ========================================
  # ADMIN — ADMINISTRADORES (MASTER)
  # ========================================

  /admin/admins:
    get:
      tags: [Admin]
      summary: Lista administradores ativos e inativos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de administradores no campo data
        "401":
          description: Autenticação necessária
        "403":
          description: Exige Master ativo
    post:
      tags: [Admin]
      summary: Provisiona um administrador com e-mail confirmado
      description: Exige Master ativo. O provisionamento é direto e não envia convite.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, password, admin_level]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 150
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 72
                  writeOnly: true
                admin_level:
                  type: string
                  enum: [MASTER, OPERATIONAL]
      responses:
        "201":
          description: Administrador criado, sem senha na resposta
        "400":
          description: Dados inválidos
        "401":
          description: Autenticação necessária
        "403":
          description: Exige Master ativo
        "409":
          description: E-mail já cadastrado

  /admin/admins/{id}:
    patch:
      tags: [Admin]
      summary: Atualiza nível ou situação de um administrador
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                admin_level:
                  type: string
                  enum: [MASTER, OPERATIONAL]
                is_active:
                  type: boolean
      responses:
        "200":
          description: Administrador atualizado
        "400":
          description: Dados inválidos
        "401":
          description: Autenticação necessária
        "403":
          description: Exige Master ativo
        "404":
          description: Administrador não encontrado
        "409":
          description: Último Master ativo deve ser preservado

  # ========================================
  # ADMIN — ÓRGÃOS (AGENCIES)
  # ========================================

  /admin/agencies:
    get:
      tags: [Admin]
      summary: Lista órgãos ativos e inativos para administradores ativos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Catálogo no campo data
        "401":
          description: Autenticação necessária
        "403":
          description: Exige administrador ativo
    post:
      tags: [Admin]
      summary: Cadastra um órgão como Master ativo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AgencyChanges"
                - required: [name, email]
      responses:
        "201":
          description: Órgão cadastrado no campo data
        "400":
          description: Dados inválidos
        "401":
          description: Autenticação necessária
        "403":
          description: Exige Master ativo

  /admin/agencies/{id}:
    patch:
      tags: [Admin]
      summary: Edita ou desativa um órgão como Master ativo
      description: A desativação bloqueia novos encaminhamentos e preserva os anteriores.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencyChanges"
      responses:
        "200":
          description: Órgão atualizado no campo data
        "400":
          description: Dados ou identificador inválidos
        "401":
          description: Autenticação necessária
        "403":
          description: Exige Master ativo
        "404":
          description: Órgão não encontrado

# ==========================================
# COMPONENTES REUTILIZÁVEIS
# ==========================================

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Informe o Access Token JWT emitido pelo Supabase Auth.

        Formato:
        Bearer <access_token>

        O token é validado pela API utilizando
        supabase.auth.getUser(token).

  schemas:
    # ======================================
    # ADMIN — ÓRGÃOS / AGENCIES
    # ======================================

    AgencyChanges:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 150
        phone:
          type: [string, "null"]
          minLength: 1
          maxLength: 20
        description:
          type: [string, "null"]
        is_active:
          type: boolean

    # ======================================
    # NOTIFICAÇÕES
    # ======================================

    Notification:
      type: object
      required: [id, occurrence_id, title, message, type, read_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        occurrence_id:
          type: [string, "null"]
          format: uuid
        title:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [OCCURRENCE_STATUS_CHANGED, CITIZEN_RESPONSE]
        read_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    # ======================================
    # VOTES
    # ======================================

    VoteCountResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [occurrence_id, vote_count]
          properties:
            occurrence_id:
              type: string
              format: uuid
            vote_count:
              type: integer
              minimum: 0

    # ======================================
    # API1-48 — DETALHES DA ANÁLISE DE IA
    # ======================================

    AiAnalysisDetails:
      type: object
      required:
        - id
        - status
        - category_code
        - suggested_description
        - confidence
        - model_name
        - prompt_version
        - error_code
        - photo_count
        - created_at
        - completed_at
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [UPLOADING, PENDING, PROCESSING, COMPLETED, FAILED, CANCELLED, CONSUMED]
        category_code:
          type: [string, "null"]
          enum: [CAT01, CAT02, CAT03, CAT04, CAT05, CAT06, CAT07, null]
        suggested_description:
          type: [string, "null"]
          maxLength: 500
        confidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        model_name:
          type: [string, "null"]
        prompt_version:
          type: [string, "null"]
        error_code:
          type: [string, "null"]
        photo_count:
          type: integer
          minimum: 1
          maximum: 3
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time

    # ======================================
    # CAT-01 — CATEGORIAS
    # ======================================

    Category:
      type: object
      required:
        - id
        - code
        - name
        - description
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único da categoria.
        code:
          type: string
          description: Código único da categoria.
          example: CAT01
        name:
          type: string
          description: Nome da categoria.
          example: Saneamento e Drenagem
        description:
          type: [string, "null"]
          description: Descrição opcional da categoria.

    CategoriesListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    # ======================================
    # HEALTH
    # ======================================

    HealthResponse:
      type: object
      required:
        - status
        - message
        - timestamp
      properties:
        status:
          type: string
          example: ok
        message:
          type: string
          example: InfraMap API funcionando!
        timestamp:
          type: string
          format: date-time

    # ======================================
    # ID-01 — PERFIL CADASTRAL
    # ======================================

    AccountProfile:
      type: object
      description: |
        Dados cadastrais do usuário autenticado.

        As propriedades de autorização são mantidas
        separadamente na tabela user_roles.

        O e-mail é obtido do Supabase Auth.
      required:
        - id
        - name
        - phone
        - created_at
        - updated_at
        - email
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Identificador único do usuário.
        name:
          type: string
          readOnly: true
          description: Nome cadastrado do usuário.
          example: Maria Silva
        phone:
          type: [string, "null"]
          readOnly: true
          description: Telefone cadastrado do usuário.
          example: "(75) 99999-9999"
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Data de criação do perfil.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Data da última atualização do perfil.
        email:
          type: [string, "null"]
          format: email
          readOnly: true
          description: |
            E-mail autenticado pelo Supabase Auth.
            Não pode ser alterado por este endpoint.
          example: maria@example.com

    MyProfileResponse:
      type: object
      description: Resposta de consulta ou atualização do perfil.
      required:
        - message
        - data
      properties:
        message:
          type: string
          description: Mensagem do resultado da operação.
          example: Usuário autenticado.
        data:
          $ref: "#/components/schemas/AccountProfile"

    UpdateMyProfileRequest:
      type: object
      description: |
        Dados permitidos para atualização do próprio perfil.

        Pelo menos um campo deve ser informado.

        Campos administrativos e informações de
        autenticação não são permitidos.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 150
          description: |
            Nome do usuário.
            Deve conter entre 3 e 150 caracteres.
          example: Maria Souza
        phone:
          type: [string, "null"]
          minLength: 8
          maxLength: 20
          pattern: '^\+?[0-9 ()-]+$'
          description: |
            Telefone do usuário.

            Pode conter números, espaços,
            parênteses, hífens e sinal de +.

            Deve possuir entre 8 e 15 dígitos
            numéricos, desconsiderando a formatação.

            Envie null para remover o telefone.
          example: "(75) 98888-8888"

    # ======================================
    # IDENTITY — VALIDAÇÃO DE CADASTRO
    # ======================================

    CreateUserRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 150
          description: Nome do usuário.
          example: Maria Silva
        email:
          type: string
          format: email
          description: E-mail do usuário.
          example: maria@example.com
        password:
          type: string
          format: password
          minLength: 6
          writeOnly: true
          description: Senha com pelo menos 6 caracteres.
          example: senha123
        role:
          type: string
          enum: [CITIZEN, ADMIN]
          default: CITIZEN
          description: Perfil inicial do usuário.

    UserValidationResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Dados validados. Nenhum usuário foi criado.

    UsersQueryResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20

    UserLookupResponse:
      type: object
      properties:
        message:
          type: string
          example: Buscando usuário.

    # ======================================
    # IDENTIDADE AUTENTICADA
    # ======================================

    AuthenticatedUserResponse:
      type: object
      properties:
        message:
          type: string
          example: Usuário autenticado.
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: [string, "null"]
              format: email

    IdentityResponse:
      type: object
      required:
        - id
        - role
        - is_active
      properties:
        id:
          type: string
          format: uuid
          description: Identificador do usuário.
        role:
          type: string
          enum: [CITIZEN, ADMIN]
          description: Perfil cadastrado para o usuário.
        is_active:
          type: boolean
          description: Situação da conta.

    # ======================================
    # RESPOSTAS GENÉRICAS
    # ======================================

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string

  # ========================================
  # RESPOSTAS DE ERRO
  # ========================================

  responses:
    BadRequest:
      description: |
        Requisição inválida ou dados não passaram
        pela validação.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: BAD_REQUEST
              message: "Erro de validação: dados inválidos."

    Unauthorized:
      description: |
        Token JWT ausente, inválido ou expirado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAUTHORIZED
              message: Token inválido ou expirado.

    Forbidden:
      description: |
        Usuário sem permissão, com perfil de autorização
        inexistente ou com conta inativa.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: FORBIDDEN
              message: Você não possui permissão para esta operação.

    NotFound:
      description: |
        Rota ou recurso não encontrado.

        No gerenciamento de perfil, também pode indicar
        ausência do perfil cadastral do usuário.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: NOT_FOUND
              message: Perfil cadastral não encontrado.

    PayloadTooLarge:
      description: Corpo JSON excede 100 KB ou uma fotografia excede 5 MB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: O corpo da requisição excede o limite permitido.

    TooManyRequests:
      description: Limite de requisições excedido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: TOO_MANY_REQUESTS
              message: Muitas requisições. Tente novamente mais tarde.

    InternalServerError:
      description: Erro interno inesperado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL_SERVER_ERROR
              message: Ocorreu um erro interno no servidor.