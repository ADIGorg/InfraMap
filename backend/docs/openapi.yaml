openapi: 3.1.0

info:
  title: InfraMap API
  version: 1.1.0
  license:
    name: UNLICENSED
    identifier: UNLICENSED
  description: |
    API REST do InfraMap — autenticação via Supabase Auth, identidade
    de cidadãos e administradores, gerenciamento de perfil, registro e
    acompanhamento de ocorrências de infraestrutura urbana, análise
    assistida por IA, moderação administrativa, votos comunitários e
    notificações.

    Todas as operações de leitura e escrita de ocorrências passam por
    RPCs ou views do PostgreSQL com `security definer` / `security invoker`,
    respeitando Row Level Security (RLS). A API não expõe SELECT direto
    em `occurrences` para `anon`/`authenticated`.

    O endpoint DELETE /identity/me anonimiza permanentemente os dados
    de contato do usuário (RN058) — o autor deve ser avisado no cliente.

servers:
  - url: http://localhost:3000/api/v1
    description: Ambiente local de desenvolvimento

tags:
  - name: Health
    description: Verificação de disponibilidade da API.
  - name: Categories
    description: Consulta pública às categorias de infraestrutura.
  - name: Identity
    description: Identificação e gerenciamento de perfis de usuários.
  - name: App
    description: Endpoints destinados ao aplicativo cidadão autenticado.
  - name: Admin
    description: Endpoints destinados ao painel administrativo.
  - name: Notifications
    description: Notificações do cidadão autenticado.
  - name: Public
    description: Consultas anônimas ao mapa público de ocorrências.
  - name: Occurrences
    description: Registro e acompanhamento de ocorrências pelo cidadão.
  - name: Moderation
    description: Análise e gerenciamento de ocorrências pelo administrador.
  - name: Photos
    description: Acesso a URLs assinadas das evidências fotográficas.
  - name: Forwardings
    description: Encaminhamento de ocorrências a órgãos externos por e-mail.

paths:
  # ========================================
  # HEALTH
  # ========================================
  /health:
    get:
      tags: [Health]
      summary: Verificar disponibilidade da API
      operationId: getHealth
      security: []
      responses:
        "200":
          description: API funcionando.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  # ========================================
  # CATEGORIES
  # ========================================
  /categories:
    get:
      tags: [Categories]
      summary: Listar categorias ativas
      operationId: listActiveCategories
      security: []
      responses:
        "200":
          description: Categorias ativas retornadas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoriesListResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  # ========================================
  # IDENTITY — ROTAS PROVISÓRIAS
  # ========================================
  /identity/users:
    post:
      tags: [Identity]
      summary: Validar dados para criação de usuário (provisório)
      description: |
        Endpoint provisório. Valida o body com Zod mas **não cria** usuário
        em `auth.users`. A implementação definitiva pertence a um ticket
        separado (ARC-01). Requer ADMIN.
      operationId: validateUserCreation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Dados validados. Nenhum usuário foi criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserValidationResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    get:
      tags: [Identity]
      summary: Validar parâmetros de consulta de usuários (provisório)
      operationId: validateUsersQuery
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Parâmetros validados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsersQueryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /identity/users/{id}:
    get:
      tags: [Identity]
      summary: Validar identificador de usuário (provisório)
      operationId: validateUserId
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Identificador válido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ========================================
  # ID-01 — PERFIL DO PRÓPRIO USUÁRIO
  # ========================================
  /identity/me:
    get:
      tags: [Identity]
      summary: Consultar o próprio perfil
      description: |
        Retorna dados cadastrais de `public.profiles` + e-mail de
        `auth.users`. Requer JWT válido e conta ativa.
      operationId: getMyProfile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Perfil consultado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyProfileResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      tags: [Identity]
      summary: Atualizar o próprio perfil
      description: |
        Atualiza somente `name` e `phone`. `phone` aceita `null` para
        remoção. Pelo menos um campo deve ser enviado. Campos como
        `id`, `email`, `role`, `admin_level` e `is_active` são rejeitados.
      operationId: updateMyProfile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMyProfileRequest" }
      responses:
        "200":
          description: Perfil atualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyProfileResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: [Identity]
      summary: Desativar e anonimizar a própria conta
      description: |
        Revoga sessões, desativa `user_roles`, substitui `name` por
        "Usuário excluído", remove `phone` e agenda limpeza assíncrona
        de `auth.users` (email anonimizado). Ocorrências e histórico
        permanecem. **Ação irreversível.**
      operationId: deactivateMyAccount
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Conta desativada e anonimizada.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Falha na revogação de sessões ou limpeza de Auth pendente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /identity/admin-check:
    get:
      tags: [Identity]
      summary: Verificar acesso administrativo
      operationId: checkAdminAccess
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Acesso autorizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ========================================
  # APP — IDENTIDADE DO CIDADÃO
  # ========================================
  /app/me:
    get:
      tags: [App]
      summary: Identificar cidadão autenticado
      operationId: getCitizenIdentity
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Identidade do cidadão.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ========================================
  # ADMIN — IDENTIDADE DO ADMINISTRADOR
  # ========================================
  /admin/me:
    get:
      tags: [Admin]
      summary: Identificar administrador autenticado
      operationId: getAdminIdentity
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Identidade do administrador.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ========================================
  # OCCURRENCES — CIDADÃO
  # ========================================
  /occurrences/finalize:
    post:
      tags: [Occurrences]
      summary: Registrar nova ocorrência
      description: |
        Consome uma análise de IA `COMPLETED` (RN063/RN064) e cria a
        ocorrência em status `RECEIVED` (RN026). Categoria e descrição
        precisam ser coerentes com `categorySource`/`descriptionSource`
        (RN068). 1 a 3 fotos JPEG/PNG com até 5 MB cada (RN010).
      operationId: finalizeOccurrence
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinalizeOccurrenceRequest" }
      responses:
        "201":
          description: Ocorrência registrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinalizeOccurrenceResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Análise já consumida, não `COMPLETED` ou pertence a outro usuário.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500":
          description: |
            Falha ao persistir ou ao mover fotos do bucket. Quando o RPC
            commita mas o move falha, a mensagem contém o `occurrenceId`
            para recuperação manual.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /occurrences/mine:
    get:
      tags: [Occurrences]
      summary: Listar ocorrências do próprio cidadão
      description: |
        Lista paginada das ocorrências do autor (RN045), incluindo
        `RESOLVED` e `REJECTED`. A localização exata é exposta ao autor
        (RN020). Filtros de status/bbox **não são aplicados** nesta versão.
      operationId: listMyOccurrences
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PageQuery" }
        - { $ref: "#/components/parameters/PageSizeQuery" }
        - { $ref: "#/components/parameters/SortQuery" }
      responses:
        "200":
          description: Lista paginada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyOccurrenceListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /occurrences/mine/{id}:
    get:
      tags: [Occurrences]
      summary: Detalhe de ocorrência própria
      operationId: getMyOccurrence
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
      responses:
        "200":
          description: Detalhe com URLs assinadas das fotos.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/MyOccurrenceDetail"
                      - type: object
                        required: [photoUrls]
                        properties:
                          photoUrls:
                            type: array
                            items: { $ref: "#/components/schemas/OccurrencePhotoWithUrl" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Não é o autor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /occurrences/{id}/history:
    get:
      tags: [Occurrences]
      summary: Histórico da ocorrência
      description: |
        Eventos em ordem cronológica ascendente. O autor vê apenas
        `CITIZEN_RESPONSE` em observações; o admin vê `INTERNAL` também
        (RN044). Autorização decidida no use case.
      operationId: getOccurrenceHistory
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
      responses:
        "200":
          description: Histórico retornado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ========================================
  # OCCURRENCES — PÚBLICO
  # ========================================
  /occurrences/public:
    get:
      tags: [Public]
      summary: Listar ocorrências no mapa público
      description: |
        Retorna somente `CONFIRMED` e `IN_SERVICE` (RN022), com
        localização aproximada (~110 m) e sem fotos ou dados do autor.
        Cacheável e seguro para anônimos.
      operationId: listPublicOccurrences
      security: []
      parameters:
        - { $ref: "#/components/parameters/PageQuery" }
        - { $ref: "#/components/parameters/PageSizeQuery" }
        - { $ref: "#/components/parameters/SortQuery" }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Lista pública paginada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicOccurrenceListResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /occurrences/public/{id}:
    get:
      tags: [Public]
      summary: Detalhe público de ocorrência
      operationId: getPublicOccurrence
      security: []
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
      responses:
        "200":
          description: Detalhe público com URLs assinadas das fotos.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PublicOccurrence"
                      - type: object
                        properties:
                          photoUrls:
                            type: array
                            items:
                              type: object
                              properties:
                                mimeType: { type: string }
                                sizeBytes: { type: integer }
                                position: { type: integer }
                                url: { type: string, format: uri }
                                expiresAt: { type: string, format: date-time }
                                expiresInSeconds: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }

  # ========================================
  # OCCURRENCES — ADMIN
  # ========================================
  /admin/occurrences:
    get:
      tags: [Admin]
      summary: Listar ocorrências no painel administrativo
      description: |
        Admin ativo. Filtros: `status`, `category` (UUID ou CATxx),
        `priority`, `min_votes`, `sort` (`created_at` | `priority` |
        `status_updated_at` | `votes`), `order` (`asc` | `desc`).
        Padrão: `created_at desc` (RN053).
      operationId: adminListOccurrences
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PageQuery" }
        - { $ref: "#/components/parameters/PageSizeQuery" }
        - { $ref: "#/components/parameters/SortQuery" }
        - name: status
          in: query
          schema: { type: array, items: { $ref: "#/components/schemas/OccurrenceStatus" } }
          style: form
          explode: true
        - name: category
          in: query
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: priority
          in: query
          schema: { type: array, items: { $ref: "#/components/schemas/OccurrencePriority" } }
          style: form
          explode: true
        - name: min_votes
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Lista paginada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOccurrenceListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/occurrences/{id}:
    get:
      tags: [Admin]
      summary: Detalhe de ocorrência (visão administrativa)
      operationId: adminGetOccurrence
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
      responses:
        "200":
          description: Detalhe com campos internos.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/AdminOccurrenceDetail"
                      - type: object
                        required: [photoUrls]
                        properties:
                          photoUrls:
                            type: array
                            items: { $ref: "#/components/schemas/OccurrencePhotoWithUrl" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ========================================
  # MODERATION — ADMIN
  # ========================================
  /admin/occurrences/{id}/start-analysis:
    patch:
      tags: [Moderation]
      summary: Iniciar análise (RECEIVED → UNDER_ANALYSIS)
      operationId: startAnalysis
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
      responses:
        "200":
          description: Status alterado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Transição inválida (não está RECEIVED).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/occurrences/{id}/confirm:
    post:
      tags: [Moderation]
      summary: Confirmar ocorrência (UNDER_ANALYSIS → CONFIRMED)
      operationId: confirmOccurrence
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
      responses:
        "200":
          description: Ocorrência confirmada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Transição inválida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/occurrences/{id}/reject:
    post:
      tags: [Moderation]
      summary: Rejeitar ocorrência (UNDER_ANALYSIS → REJECTED)
      description: Justificativa obrigatória (RN037), mínimo 10 caracteres.
      operationId: rejectOccurrence
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectOccurrenceRequest" }
      responses:
        "200":
          description: Ocorrência rejeitada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Transição inválida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/occurrences/{id}/priority:
    patch:
      tags: [Moderation]
      summary: Definir ou alterar prioridade (RN036)
      description: |
        Permitido em `CONFIRMED`, `IN_SERVICE` e `RESOLVED` (o admin
        pode corrigir após a confirmação). Rejeita valor idêntico.
      operationId: setOccurrencePriority
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPriorityRequest" }
      responses:
        "200":
          description: Prioridade definida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ocorrência não está elegível.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/occurrences/{id}/start-service:
    post:
      tags: [Moderation]
      summary: Iniciar atendimento (CONFIRMED → IN_SERVICE, RN061)
      description: |
        Exige prioridade previamente definida (RN061) e registro da ação
        concreta. Sem priority → 409.
      operationId: startService
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartServiceRequest" }
      responses:
        "200":
          description: Atendimento iniciado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Transição inválida ou prioridade ausente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/occurrences/{id}/resolve:
    post:
      tags: [Moderation]
      summary: Resolver ocorrência (IN_SERVICE → RESOLVED, RN031)
      operationId: resolveOccurrence
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveOccurrenceRequest" }
      responses:
        "200":
          description: Ocorrência resolvida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Transição inválida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/occurrences/{id}/observations:
    post:
      tags: [Moderation]
      summary: Registrar observação administrativa (RN043/RN044)
      description: |
        `INTERNAL` fica visível apenas a admins; `CITIZEN_RESPONSE`
        dispara uma notificação automática ao autor via trigger.
      operationId: createObservation
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateObservationRequest" }
      responses:
        "201":
          description: Observação registrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObservationResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/occurrences/{id}/location:
    patch:
      tags: [Moderation]
      summary: Ajustar localização administrativa (RN021)
      description: |
        Altera `location_adjusted`; `location_original` permanece
        imutável (trigger). Rejeita ocorrências terminais
        (`RESOLVED`/`REJECTED`). Latitude antes de longitude na API;
        internamente a RPC recebe `p_new_lon`/`p_new_lat`.
      operationId: adjustLocation
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustLocationRequest" }
      responses:
        "200":
          description: Localização ajustada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ocorrência terminal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/occurrences/{id}/classification:
    patch:
      tags: [Moderation]
      summary: Corrigir categoria e/ou descrição (RN025/RN068)
      description: |
        Marca `field_source='ADMIN_CORRECTED'` no histórico. Pelo menos
        um dos campos deve ser enviado. Só permitido em `UNDER_ANALYSIS`,
        `CONFIRMED`, `IN_SERVICE` ou `RESOLVED`.
      operationId: correctClassification
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectClassificationRequest" }
      responses:
        "200":
          description: Classificação corrigida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Status incompatível ou nenhuma alteração efetiva.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/occurrences/{id}/forwardings:
    post:
      tags: [Forwardings]
      summary: Encaminhar ocorrência a órgão por e-mail (RN060/RN070)
      description: |
        Admin ativo. Ocorrência precisa estar em CONFIRMED e o órgão ativo.
        Cria `forwardings` como PENDING, envia e-mail, atualiza para
        SENT/FAILED de forma atômica. O status da ocorrência **não muda**.
        Resposta 201 mesmo quando o provedor falha (status=FAILED, error_code
        preenchido) — a tentativa é persistida para auditoria.
      operationId: forwardOccurrence
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agency_id]
              properties:
                agency_id: { type: string, format: uuid }
                observations: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Encaminhamento registrado (SENT ou FAILED).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ForwardingResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ocorrência não está CONFIRMED ou órgão inativo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      tags: [Forwardings]
      summary: Listar tentativas de encaminhamento
      description: |
        Admin ativo. Retorna todas as tentativas (PENDING, SENT, FAILED),
        ordenadas por `created_at DESC`.
      operationId: listForwardings
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
      responses:
        "200":
          description: Lista de tentativas.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ForwardingListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ========================================
  # VOTES
  # ========================================
  /occurrences/{id}/votes:
    get:
      tags: [Public]
      summary: Contagem pública de votos
      operationId: getVoteCount
      security: []
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
      responses:
        "200":
          description: Contagem atual.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoteCountResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [App]
      summary: Votar em ocorrência pública (RN059)
      description: |
        Apenas cidadão ativo, em `CONFIRMED`/`IN_SERVICE`, sem auto-voto.
        Segundo voto → 409.
      operationId: addVote
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
      responses:
        "201":
          description: Voto registrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoteCountResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Voto duplicado ou ocorrência inelegível.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /occurrences/{id}/votes/me:
    delete:
      tags: [App]
      summary: Retirar o próprio voto
      operationId: removeVote
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
      responses:
        "200":
          description: Voto retirado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoteCountResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Voto não encontrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ========================================
  # PHOTOS
  # ========================================
  /occurrences/public/{id}/photos/{photoId}:
    get:
      tags: [Photos]
      summary: URL assinada de foto pública
      description: |
        Acesso anônimo. Retorna URL assinada (TTL 5 min) para fotos de
        ocorrências `CONFIRMED`/`IN_SERVICE`. Não expõe `storage_path`.
      operationId: getPublicPhotoSignedUrl
      security: []
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
        - { $ref: "#/components/parameters/PhotoIdPath" }
      responses:
        "200":
          description: URL assinada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SignedPhotoUrl" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /occurrences/mine/{id}/photos/{photoId}:
    get:
      tags: [Photos]
      summary: URL assinada de foto própria
      description: Somente o autor da ocorrência.
      operationId: getMyPhotoSignedUrl
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
        - { $ref: "#/components/parameters/PhotoIdPath" }
      responses:
        "200":
          description: URL assinada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SignedPhotoUrl" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/occurrences/{id}/photos/{photoId}:
    get:
      tags: [Photos]
      summary: URL assinada de foto (admin)
      description: Admin ativo pode acessar qualquer foto.
      operationId: getAdminPhotoSignedUrl
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OccurrenceIdPath" }
        - { $ref: "#/components/parameters/PhotoIdPath" }
      responses:
        "200":
          description: URL assinada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SignedPhotoUrl" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ========================================
  # AI-02 / AI-03 — ANÁLISE DE FOTOGRAFIAS
  # ========================================
  /ai-analyses:
    post:
      tags: [App]
      summary: Criar análise com fotografias
      operationId: createAiAnalysis
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photos]
              properties:
                photos:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items: { type: string, format: binary }
      responses:
        "201":
          description: Análise criada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, status, photo_count]
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string, enum: [PENDING] }
                      photo_count: { type: integer, minimum: 1, maximum: 3 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  /ai-analyses/{id}/analyze:
    post:
      tags: [App]
      summary: Solicitar processamento de IA
      operationId: processAiAnalysis
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: Processamento aceito (assíncrono).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      message: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Análise não elegível.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /ai-analyses/{id}:
    get:
      tags: [App]
      summary: Consultar a própria análise
      operationId: getAiAnalysis
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Análise encontrada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AiAnalysisDetails" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ========================================
  # NOTIFICATIONS
  # ========================================
  /notifications:
    get:
      tags: [Notifications]
      summary: Listar notificações do cidadão
      operationId: listNotifications
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PageQuery" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Notificações paginadas.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      total_pages: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Marcar uma notificação como lida
      operationId: markNotificationRead
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Notificação marcada como lida. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Marcar todas as notificações como lidas
      operationId: markAllNotificationsRead
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Operação concluída. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ========================================
  # ADMIN — DASHBOARD
  # ========================================
  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Consultar indicadores administrativos
      description: |
        Exige ADMIN ativo. Inclui contagens por status (sempre os seis,
        mesmo zero), total HIGH, média de resolução em dias corridos
        fracionários, e alertas de SLA violado (RN055/RN057).
      operationId: getAdminDashboard
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Indicadores calculados em uma única consulta.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboardResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  # ========================================
  # ADMIN — ADMINISTRADORES (MASTER)
  # ========================================
  /admin/admins:
    get:
      tags: [Admin]
      summary: Listar administradores
      operationId: listAdministrators
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista no campo data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        admin_level: { $ref: "#/components/schemas/AdminLevel" }
                        is_active: { type: boolean }
                        created_by: { type: [string, "null"], format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Provisionar administrador (Master)
      operationId: createAdministrator
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdminRequest" }
      responses:
        "201":
          description: Administrador criado (sem senha na resposta).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdministratorResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: E-mail já cadastrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/admins/{id}:
    patch:
      tags: [Admin]
      summary: Atualizar nível ou situação de administrador
      operationId: updateAdministrator
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                admin_level: { $ref: "#/components/schemas/AdminLevel" }
                is_active: { type: boolean }
      responses:
        "200":
          description: Administrador atualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdministratorResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Tentativa de rebaixar o último Master ativo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ========================================
  # ADMIN — ÓRGÃOS (AGENCIES)
  # ========================================
  /admin/agencies:
    get:
      tags: [Admin]
      summary: Listar órgãos
      operationId: listAgencies
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Catálogo no campo data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AgencyResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Cadastrar órgão (Master)
      operationId: createAgency
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AgencyChanges"
                - required: [name, email]
      responses:
        "201":
          description: Órgão cadastrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AgencyResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/agencies/{id}:
    patch:
      tags: [Admin]
      summary: Editar ou desativar órgão (Master)
      operationId: updateAgency
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgencyChanges" }
      responses:
        "200":
          description: Órgão atualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AgencyResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

# ==========================================
# COMPONENTES
# ==========================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access Token JWT do Supabase Auth. Enviado como
        `Authorization: Bearer <token>`. Validado por
        `supabase.auth.getUser(token)`.

  parameters:
    PageQuery:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSizeQuery:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SortQuery:
      name: sort
      in: query
      schema: { type: string, enum: [recent, oldest, most_liked], default: recent }
    OccurrenceIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PhotoIdPath:
      name: photoId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    # ─────────────────────────────────────
    # Enums
    # ─────────────────────────────────────
    OccurrenceStatus:
      type: string
      enum: [RECEIVED, UNDER_ANALYSIS, CONFIRMED, IN_SERVICE, RESOLVED, REJECTED]
    OccurrencePriority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    DataSource:
      type: string
      enum: [AI_CONFIRMED, AI_EDITED, USER_MANUAL]
    AdminLevel:
      type: string
      enum: [MASTER, OPERATIONAL]
    ObservationVisibility:
      type: string
      enum: [INTERNAL, CITIZEN_RESPONSE]
    ForwardingStatus:
      type: string
      enum: [PENDING, SENT, FAILED]
    ForwardingResponse:
      type: object
      required: [id, occurrenceId, agencyId, recipientEmail, subject, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        occurrenceId: { type: string, format: uuid }
        agencyId: { type: string, format: uuid }
        recipientEmail: { type: string, format: email }
        subject: { type: string, maxLength: 200 }
        observations: { type: [string, "null"], maxLength: 2000 }
        status: { $ref: "#/components/schemas/ForwardingStatus" }
        providerMessageId: { type: [string, "null"] }
        errorCode: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        sentAt: { type: [string, "null"], format: date-time }
    ForwardingListItem:
      allOf:
        - $ref: "#/components/schemas/ForwardingResponse"
        - type: object
          required: [agencyName, adminName, adminId]
          properties:
            agencyName: { type: string }
            adminId: { type: string, format: uuid }
            adminName: { type: string }

    # ─────────────────────────────────────
    # Primitivos
    # ─────────────────────────────────────
    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    CategorySummary:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: CAT01 }
        name: { type: string }

    Category:
      type: object
      required: [id, code, name, description]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: CAT01 }
        name: { type: string, example: Saneamento e Drenagem }
        description: { type: [string, "null"] }

    CategoriesListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Category" }

    Pagination:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    # ─────────────────────────────────────
    # Occurrences
    # ─────────────────────────────────────
    OccurrencePhoto:
      type: object
      required: [storagePath, mimeType, sizeBytes, position]
      properties:
        storagePath: { type: string }
        mimeType: { type: string, enum: [image/jpeg, image/png] }
        sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
        position: { type: integer, minimum: 1, maximum: 3 }

    PublicOccurrence:
      type: object
      required: [id, category, description, status, location, votesCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/CategorySummary" }
        description: { type: string, maxLength: 500 }
        status: { $ref: "#/components/schemas/OccurrenceStatus" }
        location:
          allOf:
            - $ref: "#/components/schemas/GeoPoint"
          description: Aproximada (~110 m)
        votesCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }

    PublicOccurrenceListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PublicOccurrence" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    MyOccurrence:
      type: object
      required: [id, category, description, status, priority, location, photosCount, votesCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/CategorySummary" }
        description: { type: string, maxLength: 500 }
        status: { $ref: "#/components/schemas/OccurrenceStatus" }
        priority:
          oneOf:
            - { $ref: "#/components/schemas/OccurrencePriority" }
            - { type: "null" }
        location:
          allOf:
            - $ref: "#/components/schemas/GeoPoint"
          description: Exata (é a do autor — RN020)
        photosCount: { type: integer, minimum: 0 }
        votesCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }

    MyOccurrenceDetail:
      allOf:
        - $ref: "#/components/schemas/MyOccurrence"
        - type: object
          properties:
            photos:
              type: array
              items: { $ref: "#/components/schemas/OccurrencePhoto" }

    MyOccurrenceListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/MyOccurrence" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    AdminOccurrence:
      allOf:
        - $ref: "#/components/schemas/MyOccurrence"
        - type: object
          required: [author]
          properties:
            author:
              type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }

    AdminOccurrenceDetail:
      allOf:
        - $ref: "#/components/schemas/AdminOccurrence"
        - type: object
          properties:
            photos:
              type: array
              items: { $ref: "#/components/schemas/OccurrencePhoto" }
            locationOriginal: { $ref: "#/components/schemas/GeoPoint" }
            locationAdjusted:
              oneOf:
                - { $ref: "#/components/schemas/GeoPoint" }
                - { type: "null" }
            categorySource: { $ref: "#/components/schemas/DataSource" }
            descriptionSource: { $ref: "#/components/schemas/DataSource" }

    AdminOccurrenceListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AdminOccurrence" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    HistoryEvent:
      type: object
      required: [id, action, actorType, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorId:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        action: { type: string }
        actorType: { type: string, enum: [USER, SYSTEM] }
        previousData: { type: [object, "null"] }
        newData: { type: [object, "null"] }
        details: { type: [object, "null"] }
        createdAt: { type: string, format: date-time }

    HistoryListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/HistoryEvent" }

    FinalizeOccurrenceRequest:
      type: object
      required: [aiAnalysisId, categoryId, description, location, categorySource, descriptionSource, photos]
      additionalProperties: false
      properties:
        aiAnalysisId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        description: { type: string, minLength: 1, maxLength: 500 }
        location: { $ref: "#/components/schemas/GeoPoint" }
        categorySource: { $ref: "#/components/schemas/DataSource" }
        descriptionSource: { $ref: "#/components/schemas/DataSource" }
        photos:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            required: [storagePath, mimeType, sizeBytes]
            additionalProperties: false
            properties:
              storagePath: { type: string, minLength: 1 }
              mimeType: { type: string, enum: [image/jpeg, image/png] }
              sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }

    FinalizeOccurrenceResponse:
      type: object
      required: [message, data]
      properties:
        message: { type: string, example: Ocorrência registrada com sucesso. }
        data:
          type: object
          required: [id, status, summary]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [RECEIVED] }
            summary:
              type: object
              required: [categoryId, descriptionLength, photosCount]
              properties:
                categoryId: { type: string, format: uuid }
                descriptionLength: { type: integer, minimum: 1, maximum: 500 }
                photosCount: { type: integer, minimum: 1, maximum: 3 }

    # ─────────────────────────────────────
    # Photos
    # ─────────────────────────────────────
    SignedPhotoUrl:
      type: object
      required: [url, expiresAt, expiresInSeconds]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        expiresInSeconds: { type: integer, minimum: 1 }

    OccurrencePhotoWithUrl:
      allOf:
        - $ref: "#/components/schemas/OccurrencePhoto"
        - type: object
          required: [url, expiresAt, expiresInSeconds]
          properties:
            url: { type: string, format: uri }
            expiresAt: { type: string, format: date-time }
            expiresInSeconds: { type: integer, minimum: 1 }

    # ─────────────────────────────────────
    # Moderation requests
    # ─────────────────────────────────────
    RejectOccurrenceRequest:
      type: object
      required: [justification]
      additionalProperties: false
      properties:
        justification: { type: string, minLength: 10, maxLength: 2000 }

    SetPriorityRequest:
      type: object
      required: [priority]
      additionalProperties: false
      properties:
        priority: { $ref: "#/components/schemas/OccurrencePriority" }

    StartServiceRequest:
      type: object
      required: [actionNotes]
      additionalProperties: false
      properties:
        actionNotes: { type: string, minLength: 10, maxLength: 2000 }

    ResolveOccurrenceRequest:
      type: object
      additionalProperties: false
      properties:
        resolutionNotes: { type: string, maxLength: 2000 }

    CreateObservationRequest:
      type: object
      required: [content, visibility]
      additionalProperties: false
      properties:
        content: { type: string, minLength: 5, maxLength: 2000 }
        visibility: { $ref: "#/components/schemas/ObservationVisibility" }

    ObservationResponse:
      type: object
      required: [message, data]
      properties:
        message: { type: string }
        data:
          type: object
          required: [observationId]
          properties:
            observationId: { type: string, format: uuid }

    AdjustLocationRequest:
      type: object
      required: [lat, lng]
      additionalProperties: false
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    CorrectClassificationRequest:
      type: object
      additionalProperties: false
      properties:
        categoryId: { type: string, format: uuid }
        description: { type: string, minLength: 1, maxLength: 500 }

    # ─────────────────────────────────────
    # Admin dashboard
    # ─────────────────────────────────────
    AdminDashboardResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [counts_by_status, high_priority_total, average_resolution_days, sla_breaches]
          properties:
            counts_by_status:
              type: object
              required: [RECEIVED, UNDER_ANALYSIS, CONFIRMED, IN_SERVICE, RESOLVED, REJECTED]
              properties:
                RECEIVED: { type: integer, minimum: 0 }
                UNDER_ANALYSIS: { type: integer, minimum: 0 }
                CONFIRMED: { type: integer, minimum: 0 }
                IN_SERVICE: { type: integer, minimum: 0 }
                RESOLVED: { type: integer, minimum: 0 }
                REJECTED: { type: integer, minimum: 0 }
            high_priority_total: { type: integer, minimum: 0 }
            average_resolution_days:
              oneOf:
                - { type: number, minimum: 0 }
                - { type: "null" }
            sla_breaches:
              type: object
              required: [received_over_48h, under_analysis_over_5d]
              properties:
                received_over_48h: { type: integer, minimum: 0 }
                under_analysis_over_5d: { type: integer, minimum: 0 }

    # ─────────────────────────────────────
    # Votes / Notifications
    # ─────────────────────────────────────
    VoteCountResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [occurrence_id, vote_count]
          properties:
            occurrence_id: { type: string, format: uuid }
            vote_count: { type: integer, minimum: 0 }

    Notification:
      type: object
      required: [id, occurrence_id, title, message, type, read_at, created_at]
      properties:
        id: { type: string, format: uuid }
        occurrence_id:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        title: { type: string }
        message: { type: string }
        type: { type: string, enum: [OCCURRENCE_STATUS_CHANGED, CITIZEN_RESPONSE] }
        read_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        created_at: { type: string, format: date-time }

    # ─────────────────────────────────────
    # AI
    # ─────────────────────────────────────
    AiAnalysisDetails:
      type: object
      required: [id, status, photo_count, created_at]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [UPLOADING, PENDING, PROCESSING, COMPLETED, FAILED, CANCELLED, CONSUMED]
        category_code:
          oneOf:
            - type: string
              enum: [CAT01, CAT02, CAT03, CAT04, CAT05, CAT06, CAT07]
            - type: "null"
        suggested_description: { type: [string, "null"], maxLength: 500 }
        confidence:
          oneOf:
            - { type: number, minimum: 0, maximum: 1 }
            - { type: "null" }
        model_name: { type: [string, "null"] }
        prompt_version: { type: [string, "null"] }
        error_code: { type: [string, "null"] }
        photo_count: { type: integer, minimum: 0, maximum: 3 }
        created_at: { type: string, format: date-time }
        completed_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }

    # ─────────────────────────────────────
    # Identity
    # ─────────────────────────────────────
    AccountProfile:
      type: object
      required: [id, name, phone, created_at, updated_at, email]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, readOnly: true }
        phone:
          oneOf:
            - { type: string }
            - { type: "null" }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        email:
          oneOf:
            - { type: string, format: email }
            - { type: "null" }

    MyProfileResponse:
      type: object
      required: [message, data]
      properties:
        message: { type: string }
        data: { $ref: "#/components/schemas/AccountProfile" }

    UpdateMyProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 3, maxLength: 150 }
        phone:
          oneOf:
            - type: string
              minLength: 8
              maxLength: 20
              pattern: '^\+?[0-9 ()-]+$'
            - type: "null"

    CreateUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 3, maxLength: 150 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 6, writeOnly: true }
        role: { type: string, enum: [CITIZEN, ADMIN], default: CITIZEN }

    UserValidationResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }

    UsersQueryResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }

    IdentityResponse:
      type: object
      required: [id, role, is_active]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [CITIZEN, ADMIN] }
        is_active: { type: boolean }

    # ─────────────────────────────────────
    # Admins & Agencies
    # ─────────────────────────────────────
    CreateAdminRequest:
      type: object
      required: [name, email, password, admin_level]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 72, writeOnly: true }
        admin_level: { $ref: "#/components/schemas/AdminLevel" }

    AdministratorResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            admin_level: { $ref: "#/components/schemas/AdminLevel" }
            is_active: { type: boolean }
            created_by: { type: [string, "null"], format: uuid }

    AgencyChanges:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        email: { type: string, format: email, maxLength: 150 }
        phone:
          oneOf:
            - { type: string, minLength: 1, maxLength: 20 }
            - { type: "null" }
        description:
          oneOf:
            - { type: string }
            - { type: "null" }
        is_active: { type: boolean }

    AgencyResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, "null"] }
        description: { type: [string, "null"] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ─────────────────────────────────────
    # Genéricos
    # ─────────────────────────────────────
    HealthResponse:
      type: object
      required: [status, message, timestamp]
      properties:
        status: { type: string, example: ok }
        message: { type: string }
        timestamp: { type: string, format: date-time }

    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

  responses:
    BadRequest:
      description: Requisição inválida ou dados não passaram pela validação.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Token JWT ausente, inválido ou expirado.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Sem permissão, perfil inexistente ou conta inativa.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Rota ou recurso não encontrado.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    PayloadTooLarge:
      description: Corpo JSON > 100 KB ou fotografia > 5 MB.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TooManyRequests:
      description: Limite de requisições excedido.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InternalServerError:
      description: Erro interno inesperado.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }