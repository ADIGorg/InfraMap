name: InfraMap - Regras de negócio e Banco

on:
  push:
    branches:
      - test/business-rules-db-20261112
      - test/qa-01-02-03-sprint2-20261112
    paths:
      - "backend/**"
      - ".github/workflows/inframap-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/inframap-tests.yml"
  workflow_dispatch:

concurrency:
  group: inframap-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: TypeScript + Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit and HTTP integration tests
        run: npm test
        env:
          NODE_ENV: test
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
          SUPABASE_SECRET_KEY: ci-secret-key
          AI_PROVIDER: mock
          EMAIL_PROVIDER: mock

  database:
    name: Supabase local + pgTAP + API E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase database
        run: supabase start
      - name: Run pgTAP business and RLS tests
        id: pgtap
        continue-on-error: true
        run: supabase test db
      - name: E2E — Auth, API, Storage, moderation and forwarding
        id: e2e
        continue-on-error: true
        run: npm run test:e2e
      - name: Require BOTH SQL and E2E to succeed
        if: always()
        run: |
          echo "pgTAP: ${{ steps.pgtap.outcome }}"
          echo "E2E: ${{ steps.e2e.outcome }}"
          test "${{ steps.pgtap.outcome }}" = "success"
          test "${{ steps.e2e.outcome }}" = "success"
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
