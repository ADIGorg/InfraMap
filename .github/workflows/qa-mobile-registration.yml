name: QA Mobile - Registration Consent

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/qa-mobile-registration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-registration:
    name: TypeScript, lint and Jest (mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run lint
